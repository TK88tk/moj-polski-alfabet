
name: Zbuduj APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Ustaw JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ustaw Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Rozpakuj projekt
        run: unzip MojPolskiAlfabet_Chmura_MLKit.zip -d extracted

      - name: Zbuduj APK
        working-directory: extracted/MojPolskiAlfabet_Chmura
        run: gradle assembleDebug

      - name: Udostępnij APK
        uses: actions/upload-artifact@v4
        with:
          name: Moj-Polski-Alfabet-APK
          path: extracted/MojPolskiAlfabet_Chmura/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
